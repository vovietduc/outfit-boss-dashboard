<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Khuyến mãi')}"></head>
<body>
<div class="layout">
  <aside th:replace="~{admin/layout :: sidebar('promotions')}"></aside>
  <main class="main">
    <div th:replace="~{admin/layout :: pageHeader('Khuyến mãi', 'Tạo và theo dõi các chương trình giảm giá')}"></div>
    <div class="content">

      <div class="grid k4">
        <div class="card kpi"><div class="card-body row-between"><div>
          <p class="label">Tổng mã</p><p class="value" th:text="${stats.total}">8</p></div><span class="icon">🎟️</span></div></div>
        <div class="card kpi"><div class="card-body row-between"><div>
          <p class="label">Đang chạy</p><p class="value" th:text="${stats.active}">5</p></div><span class="icon">▶️</span></div></div>
        <div class="card kpi"><div class="card-body row-between"><div>
          <p class="label">Lượt sử dụng</p><p class="value" th:text="${stats.usage}">432</p></div><span class="icon">📥</span></div></div>
        <div class="card kpi"><div class="card-body row-between"><div>
          <p class="label">Tỷ lệ dùng TB</p><p class="value" th:text="${stats.usageRate} + '%'">46%</p></div><span class="icon">📊</span></div></div>
      </div>

      <div class="card">
        <div class="card-head"><h3>Tạo mã mới</h3></div>
        <div class="card-body">
          <form th:action="@{/admin/khuyen-mai/luu}" method="post" class="toolbar">
            <input name="code" placeholder="Mã (VD: SALE20)" required="required"/>
            <input name="name" class="grow" placeholder="Tên chương trình" required="required"/>
            <select name="type">
              <option value="PERCENT">Giảm %</option>
              <option value="AMOUNT">Giảm tiền</option>
              <option value="SHIPPING">Miễn ship</option>
            </select>
            <input type="number" name="value" placeholder="Giá trị" value="10"/>
            <input type="number" name="minOrder" placeholder="Đơn tối thiểu" value="200"/>
            <input type="number" name="quota" placeholder="Số lượt" value="100"/>
            <input type="date" name="startDate"/>
            <input type="date" name="endDate"/>
            <button class="btn accent" type="submit">Tạo mã</button>
          </form>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Mã</th><th>Chương trình</th><th>Loại</th><th class="num">Giá trị</th>
              <th class="num">Đơn tối thiểu</th><th>Lượt dùng</th><th>Thời hạn</th><th>Trạng thái</th><th></th></tr></thead>
            <tbody>
            <tr th:each="p : ${promotions}">
              <td th:text="${p.code}">SALE20</td>
              <td th:text="${p.name}">Giảm giá hè</td>
              <td>
                <span class="badge" th:if="${p.type == 'PERCENT'}">Giảm %</span>
                <span class="badge" th:if="${p.type == 'AMOUNT'}">Giảm tiền</span>
                <span class="badge" th:if="${p.type == 'SHIPPING'}">Miễn ship</span>
              </td>
              <td class="num" th:text="${p.value}">20</td>
              <td class="num" th:text="${#numbers.formatInteger(p.minOrder,0,'POINT')}">200</td>
              <td>
                <span th:text="${p.usage} + ' / ' + ${p.quota}">40 / 100</span>
                <span class="progress"><i th:style="'width:' + ${p.usagePercent} + '%'"></i></span>
              </td>
              <td th:text="${p.startDate} + ' → ' + ${p.endDate}">01/06 → 31/12</td>
              <td>
                <span class="badge success" th:if="${p.active}">Đang chạy</span>
                <span class="badge danger" th:unless="${p.active}">Tạm dừng</span>
              </td>
              <td>
                <form th:action="@{'/admin/khuyen-mai/' + ${p.id} + '/toggle'}" method="post" style="display:inline">
                  <button class="btn outline sm" type="submit" th:text="${p.active} ? 'Tắt' : 'Bật'">Tắt</button>
                </form>
                <form th:action="@{'/admin/khuyen-mai/' + ${p.id} + '/xoa'}" method="post" style="display:inline"
                      onsubmit="return confirm('Xóa mã này?')">
                  <button class="btn danger sm" type="submit">Xóa</button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(promotions)}"><td colspan="9" class="empty">Chưa có mã khuyến mãi</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>
</body>
</html>
